<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Lista de Tarefas</h1>
 
    <div class="form">
      <input type="text" id="tarefa" placeholder="Digite uma tarefa..." autocomplete="off">
      <button type="button" id="adicionar">Adicionar</button>
    </div>
 
    <ul id="lista"></ul>
 
    <p class="dica">Clique em uma tarefa para removê-la. Use a caixa de seleção para marcar como concluída.</p>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
